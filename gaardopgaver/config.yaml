name: Gårdopgaver
version: "1.1.0"
slug: gaardopgaver
description: Opgaver til landejendommen – opret, prioritér og planlæg i kalenderen
url: https://github.com/myschetzky/Ha
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Vises i Home Assistants sidepanel for alle brugere; login klares af Home Assistant.
ingress: true
ingress_port: 8099
panel_icon: mdi:barn
panel_title: Gårdopgaver
panel_admin: false
# Bruges til at sende sensorer (åbne/akutte opgaver, dagens plan) til dashboardet.
homeassistant_api: true
# Appen stoppes kort under backup, så databasen altid gemmes i en konsistent tilstand.
backup: cold
ports:
  8099/tcp: null
options:
  kalender_entitet: calendar.gardopgaver
schema:
  kalender_entitet: "str?"
